<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>额度 - {{.SiteName}}</title>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/tailwindcss.js"></script>
</head>
<body class="bg-[#f5f6fa] min-h-screen flex flex-col" style="font-family: 'PingFang SC', 'Helvetica Neue', Arial, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
    {{template "navbar" .}}

    <div class="flex flex-1 overflow-hidden">
        {{template "home_sidebar" .}}

        <main class="flex-1 overflow-auto p-6">
            <div class="max-w-5xl mx-auto">
                <h1 class="text-[16px] font-semibold text-gray-800 mb-5">额度</h1>

                <div id="quotaSummary" class="mb-5">
                    <div class="text-[13px] text-gray-400 py-8 text-center">加载中...</div>
                </div>

                <h2 class="text-[14px] font-semibold text-gray-700 mb-3">分实例用量</h2>
                <div id="instanceSection">
                    <div class="text-[13px] text-gray-400 py-8 text-center">加载中...</div>
                </div>

                <h2 class="text-[14px] font-semibold text-gray-700 mt-6 mb-3">今日调用日志</h2>
                <div id="logsSection">
                    <div class="text-[13px] text-gray-400 py-8 text-center">加载中...</div>
                </div>
            </div>
        </main>
    </div>

    {{template "home_scripts" .}}
    <script>
    (function() {
        var jsonHeaders = {'Accept': 'application/json'};
        var today = new Date().toISOString().slice(0, 10);

        function barColor(used, quota) {
            if (quota < 0) return 'bg-[#0052d9] opacity-40';
            var pct = used * 100 / quota;
            if (pct >= 90) return 'bg-red-500';
            if (pct >= 70) return 'bg-yellow-500';
            return 'bg-[#0052d9]';
        }

        function barWidth(used, quota) {
            if (quota < 0) return '100%';
            return Math.min(100, used * 100 / quota).toFixed(1) + '%';
        }

        function quotaLabel(used, quota) {
            if (quota >= 0) return used.toLocaleString() + ' / ' + quota.toLocaleString();
            return used.toLocaleString() + ' / 无限制';
        }

        function emptyHtml(msg) {
            return '<div class="bg-white rounded shadow-sm border border-gray-100 py-8 text-center">' +
                '<p class="text-[13px] text-gray-400">' + msg + '</p></div>';
        }

        // Summary: total quota and usage
        fetch('/quota/data?group_by=&start_date=' + today + '&end_date=' + today, {headers: jsonHeaders})
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var rows = data.rows || [];
                var used = 0, prompt = 0, completion = 0;
                rows.forEach(function(r) { used += r.total_tokens; prompt += r.prompt_tokens; completion += r.completion_tokens; });
                var quota = data.quota_day;
                var cls = barColor(used, quota);
                var w = barWidth(used, quota);

                document.getElementById('quotaSummary').innerHTML =
                    '<div class="bg-white rounded shadow-sm border border-gray-100 px-5 py-4">' +
                        '<div class="flex items-center justify-between mb-2">' +
                            '<span class="text-[14px] font-semibold text-gray-800">今日总用量</span>' +
                            '<span class="text-[12px] text-gray-700 font-medium">' + quotaLabel(used, quota) + '</span>' +
                        '</div>' +
                        '<div class="w-full bg-gray-100 rounded-full h-1.5 mb-2">' +
                            '<div class="h-1.5 rounded-full transition-all duration-300 ' + cls + '" style="width:' + w + '"></div>' +
                        '</div>' +
                        '<div class="flex gap-3">' +
                            '<span class="text-[11px] text-gray-400">输入 <span class="text-gray-500">' + prompt.toLocaleString() + '</span></span>' +
                            '<span class="text-[11px] text-gray-400">输出 <span class="text-gray-500">' + completion.toLocaleString() + '</span></span>' +
                        '</div>' +
                    '</div>';
            })
            .catch(function() {
                document.getElementById('quotaSummary').innerHTML = emptyHtml('加载失败');
            });

        // Per-instance breakdown
        fetch('/quota/data?group_by=instance&start_date=' + today + '&end_date=' + today, {headers: jsonHeaders})
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var rows = data.rows || [];
                var container = document.getElementById('instanceSection');
                if (rows.length === 0) {
                    container.innerHTML = emptyHtml('暂无数据');
                    return;
                }
                container.innerHTML = '<div class="bg-white rounded shadow-sm border border-gray-100 overflow-hidden"><div class="divide-y divide-gray-50">' +
                    rows.map(function(inst) {
                        return '<div class="px-5 py-3 hover:bg-gray-50 transition-colors">' +
                            '<div class="flex items-center justify-between mb-1">' +
                                '<span class="text-[13px] text-gray-600">' + (inst.instance_name || 'instance#' + inst.instance_id) + '</span>' +
                                '<span class="text-[12px] text-gray-500">今日 <span class="text-gray-700 font-medium">' + (inst.total_tokens || 0).toLocaleString() + '</span></span>' +
                            '</div>' +
                            '<div class="flex items-center gap-6 text-[11px] text-gray-400">' +
                                '<span>输入 <span class="text-gray-500">' + (inst.prompt_tokens || 0).toLocaleString() + '</span> · 输出 <span class="text-gray-500">' + (inst.completion_tokens || 0).toLocaleString() + '</span></span>' +
                            '</div>' +
                        '</div>';
                    }).join('') +
                '</div></div>';
            })
            .catch(function() {
                document.getElementById('instanceSection').innerHTML = emptyHtml('加载失败');
            });

        // Today's call logs
        fetch('/quota/logs?start_date=' + today + '&end_date=' + today, {headers: jsonHeaders})
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var logs = data.logs || [];
                var container = document.getElementById('logsSection');
                if (logs.length === 0) {
                    container.innerHTML = emptyHtml('今日暂无调用记录');
                    return;
                }
                container.innerHTML = '<div class="bg-white rounded shadow-sm border border-gray-100 overflow-hidden">' +
                    '<table class="w-full text-[13px] text-left">' +
                    '<thead class="bg-[#f5f6fa] text-gray-500 text-[12px]">' +
                        '<tr>' +
                            '<th class="px-5 py-3 font-medium">时间</th>' +
                            '<th class="px-5 py-3 font-medium">模型</th>' +
                            '<th class="px-5 py-3 font-medium text-right">输入</th>' +
                            '<th class="px-5 py-3 font-medium text-right">输出</th>' +
                            '<th class="px-5 py-3 font-medium text-right">总计</th>' +
                            '<th class="px-5 py-3 font-medium text-right">耗时</th>' +
                            '<th class="px-5 py-3 font-medium text-right">状态</th>' +
                        '</tr>' +
                    '</thead>' +
                    '<tbody class="divide-y divide-gray-50">' +
                    logs.map(function(log) {
                        var sc = log.status_code || 0;
                        var scCls = sc >= 200 && sc < 300 ? 'text-green-600' : 'text-red-500';
                        return '<tr class="hover:bg-[#f9fafb]">' +
                            '<td class="px-5 py-2.5 text-gray-500">' + (log.created_at ? new Date(log.created_at).toLocaleString() : '') + '</td>' +
                            '<td class="px-5 py-2.5 text-gray-700">' + (log.provider ? log.provider + '/' : '') + (log.model || '-') + '</td>' +
                            '<td class="px-5 py-2.5 text-right text-gray-500">' + (log.prompt_tokens || 0).toLocaleString() + '</td>' +
                            '<td class="px-5 py-2.5 text-right text-gray-500">' + (log.completion_tokens || 0).toLocaleString() + '</td>' +
                            '<td class="px-5 py-2.5 text-right font-medium text-gray-700">' + (log.total_tokens || 0).toLocaleString() + '</td>' +
                            '<td class="px-5 py-2.5 text-right text-gray-400">' + (log.latency || 0) + 'ms</td>' +
                            '<td class="px-5 py-2.5 text-right ' + scCls + '">' + sc + '</td>' +
                        '</tr>';
                    }).join('') +
                    '</tbody></table></div>';
            })
            .catch(function() {
                document.getElementById('logsSection').innerHTML = emptyHtml('加载失败');
            });
    })();
    </script>
</body>
</html>
