<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - {{.SiteName}}</title>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/tailwindcss.js"></script>
</head>
<body class="bg-[#f5f6fa] min-h-screen flex flex-col" style="font-family: 'PingFang SC', 'Helvetica Neue', Arial, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
    {{template "navbar" .}}

    <div class="flex flex-1 overflow-hidden">
        {{template "home_sidebar" .}}

        <main class="flex-1 overflow-auto py-6 px-10">
        </main>
    </div>

    {{template "home_scripts" .}}
</body>
</html>
