<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - {{.SiteName}}</title>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/tailwindcss.js"></script>
</head>
<body class="bg-[#f5f6fa] min-h-screen flex flex-col" style="font-family: 'PingFang SC', 'Helvetica Neue', Arial, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
    {{template "navbar" .}}

    <div class="flex flex-1 overflow-hidden">
        <aside id="sidebar" class="w-56 bg-white border-r border-gray-200 flex-shrink-0 transition-all duration-200 overflow-hidden">
            <nav class="py-3">
                <a href="#" class="flex items-center space-x-3 px-5 py-3 text-[14px] text-gray-700 hover:bg-[#f2f6fc] hover:text-[#0052d9] transition-colors border-l-[3px] border-transparent">
                    <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    <span class="whitespace-nowrap">我的 OpenClaw</span>
                </a>
                <a href="#" class="flex items-center space-x-3 px-5 py-3 text-[14px] text-gray-700 hover:bg-[#f2f6fc] hover:text-[#0052d9] transition-colors border-l-[3px] border-transparent">
                    <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span class="whitespace-nowrap">模型额度</span>
                </a>
                <a href="#" class="flex items-center space-x-3 px-5 py-3 text-[14px] text-gray-700 hover:bg-[#f2f6fc] hover:text-[#0052d9] transition-colors border-l-[3px] border-transparent">
                    <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span class="whitespace-nowrap">帮助文档</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 overflow-auto py-6 px-10">
            <div class="max-w-md pt-10">
                <div class="bg-white p-6 rounded shadow-sm border border-gray-100">
                    {{block "change_password_form" .}}
                    <!-- 原密码修改表单 -->
                    <div id="change-pw-section">
                        <form hx-post="/change-password" hx-target="closest form" hx-swap="outerHTML" class="space-y-5">
                            <div>
                                <label class="block text-[14px] font-medium text-gray-700 mb-2">原密码</label>
                                <input type="password" name="old_password" required
                                    class="w-full h-10 px-3 text-[14px] border border-[#e3e6eb] rounded focus:outline-none focus:border-[#0052d9] hover:border-[#0052d9] transition-colors"
                                    placeholder="请输入原密码">
                            </div>
                            <div>
                                <label class="block text-[14px] font-medium text-gray-700 mb-2">新密码</label>
                                <input type="password" name="new_password" required
                                    class="w-full h-10 px-3 text-[14px] border border-[#e3e6eb] rounded focus:outline-none focus:border-[#0052d9] hover:border-[#0052d9] transition-colors"
                                    placeholder="请输入新密码">
                            </div>
                            <div>
                                <label class="block text-[14px] font-medium text-gray-700 mb-2">验证码</label>
                                <div class="flex items-center space-x-3">
                                    <img src="/captcha/{{.CaptchaID}}.png" alt="验证码" class="h-10 rounded border border-[#e3e6eb] cursor-pointer"
                                        onclick="this.src='/captcha/{{.CaptchaID}}.png?reload='+Math.random()">
                                    <input type="text" name="captchaValue" required
                                        class="flex-1 min-w-0 h-10 px-3 text-[14px] border border-[#e3e6eb] rounded focus:outline-none focus:border-[#0052d9] hover:border-[#0052d9] transition-colors"
                                        placeholder="请输入验证码">
                                </div>
                                <input type="hidden" name="captchaId" value="{{.CaptchaID}}">
                                <p class="text-[12px] text-gray-400 mt-1.5">点击图片可刷新验证码</p>
                            </div>

                            {{if .Error}}
                            <div class="text-[#f64041] font-medium text-center text-[14px] bg-red-50 py-2.5 rounded">{{.Error}}</div>
                            {{end}}

                            <button type="submit"
                                class="w-full h-10 bg-[#0052d9] text-white rounded hover:bg-[#0034b5] transition-colors duration-200 font-medium text-[14px]">
                                确认修改
                            </button>
                        </form>
                    </div>
                    {{end}}
                </div>
            </div>
        </main>
    </div>

    <script>
    function toggleSidebar() {
        var sb = document.getElementById('sidebar');
        if (sb.style.width === '0px') {
            sb.style.width = '';
        } else {
            sb.style.width = '0px';
        }
    }
    </script>
</body>
</html>
