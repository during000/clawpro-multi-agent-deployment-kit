<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - {{.SiteName}}</title>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/tailwindcss.js"></script>
</head>
<body class="bg-[#f5f6fa] min-h-screen flex items-center justify-center" style="font-family: 'PingFang SC', 'Helvetica Neue', Arial, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
    <div class="bg-white p-10 rounded shadow-sm w-full max-w-md border border-gray-100">
        {{if .HasLogo}}<img src="/logo" alt="Logo" class="h-12 mx-auto mb-4">{{end}}
        <h1 class="text-2xl font-semibold text-center text-[#0d1a26] mb-1">{{.SiteName}}</h1>
        <p class="text-[14px] text-gray-400 text-center mb-8">请登录您的账号</p>

        {{block "login_form" .}}
        <form hx-post="/login" hx-target="closest form" hx-swap="outerHTML" class="space-y-5">
            <div>
                <label for="username" class="block text-[14px] font-medium text-gray-700 mb-2">用户名</label>
                <input type="text" id="username" name="username" required
                    class="w-full h-12 px-3 text-[14px] border border-[#e3e6eb] rounded focus:outline-none focus:border-[#0052d9] hover:border-[#0052d9] transition-colors"
                    placeholder="请输入用户名">
            </div>

            <div>
                <label for="password" class="block text-[14px] font-medium text-gray-700 mb-2">密码</label>
                <input type="password" id="password" name="password" required
                    class="w-full h-12 px-3 text-[14px] border border-[#e3e6eb] rounded focus:outline-none focus:border-[#0052d9] hover:border-[#0052d9] transition-colors"
                    placeholder="请输入密码">
            </div>

            {{if .CaptchaID}}
            <div>
                <label class="block text-[14px] font-medium text-gray-700 mb-2">验证码</label>
                <div class="flex items-center space-x-3">
                    <img src="/captcha/{{.CaptchaID}}.png" alt="验证码" class="h-12 rounded border border-[#e3e6eb] cursor-pointer"
                        onclick="this.src='/captcha/{{.CaptchaID}}.png?reload='+Math.random()">
                    <input type="text" name="captchaValue" required
                        class="flex-1 min-w-0 h-12 px-3 text-[14px] border border-[#e3e6eb] rounded focus:outline-none focus:border-[#0052d9] hover:border-[#0052d9] transition-colors"
                        placeholder="请输入验证码">
                </div>
                <input type="hidden" name="captchaId" value="{{.CaptchaID}}">
                <p class="text-xs text-gray-400 mt-1.5">点击图片可刷新验证码</p>
            </div>
            {{end}}

            {{if .Error}}
            <div class="text-[#f64041] font-medium text-center text-[14px] bg-red-50 py-2.5 rounded">{{.Error}}</div>
            {{end}}

            <button type="submit"
                class="w-full h-12 bg-[#0052d9] text-white rounded hover:bg-[#0034b5] transition-colors duration-200 font-medium text-base">
                登录
            </button>
        </form>
        {{end}}

        {{if .HasOneID}}
        <div class="mt-5">
            <div class="relative flex items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-3 text-[12px] text-gray-400">或</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>
            <a href="/auth/oneid"
               class="mt-4 flex items-center justify-center w-full h-12 border border-[#e3e6eb] rounded hover:border-[#0052d9] hover:text-[#0052d9] transition-colors duration-200 font-medium text-[14px] text-gray-700 bg-white">
                企业 SSO 登录
            </a>
        </div>
        {{end}}
    </div>
</body>
</html>
