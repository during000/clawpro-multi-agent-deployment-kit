apiVersion: v1
kind: Service
metadata:
  name: hatchery
  namespace: clawpro-test
  labels:
    app: hatchery
  annotations:
    service.cloud.tencent.com/direct-access: 'true'
    service.kubernetes.io/service.extensiveParameters: '{"AddressIPVersion":"IPV4","InternetAccessible":{"InternetChargeType":"TRAFFIC_POSTPAID_BY_HOUR","InternetMaxBandwidthOut":100}}'
spec:
  allocateLoadBalancerNodePorts: false
  selector:
    app: hatchery
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: LoadBalancer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hatchery
  namespace: clawpro-test
  labels:
    app: hatchery
spec:
  serviceName: hatchery
  replicas: 1
  selector:
    matchLabels:
      app: hatchery
  template:
    metadata:
      labels:
        app: hatchery
    spec:
      containers:
        - name: hatchery
          image: keitewang-test.tencentcloudcr.com/clawpro-test/hatchery:it
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: tencent-cloud-credentials
                  key: secret_id
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tencent-cloud-credentials
                  key: secret_key
            - name: AGENT_CAM_ROLE_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: tencent-cloud-credentials
                  key: secret_id
            - name: AGENT_CAM_ROLE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tencent-cloud-credentials
                  key: secret_key
          args:
            - "-addr"
            - ":80"
            - "--region"
            - "ap-guangzhou"
            - "--init-user"
            - "admin"
            - "--init-pass"
            - "123456"
            - "-db"
            - "/data/hatchery.db"
            - "-domain"
            - "http://localhost"
            - "--log-json"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
