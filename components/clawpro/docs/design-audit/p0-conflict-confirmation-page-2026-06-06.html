<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawPro 设计确认表</title>
  <style>
    :root {
      --brand: #1447e6;
      --brand-soft: #eff6ff;
      --text: #0a0a0a;
      --text-2: #334155;
      --muted: #737373;
      --weak: #a3a3a3;
      --border: #EAEEF4;
      --surface: #ffffff;
      --bg: #f8fafc;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #f59e0b;
      --shadow: 0 8px 24px rgba(2, 6, 23, 0.06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      line-height: 1.5;
    }
    .page { max-width: 1180px; margin: 0 auto; padding: 40px 24px 64px; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; letter-spacing: -0.02em; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    .subtitle { margin: 0; color: var(--text-2); font-size: 14px; max-width: 820px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    button {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { border-color: var(--brand); color: var(--brand); }
    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .field {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      padding: 12px;
    }
    label.field-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    input[type='text'], textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      padding: 9px 10px;
    }
    textarea { min-height: 72px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid rgba(20, 71, 230, 0.16); border-color: var(--brand); }
    .progress-card {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #dbeafe;
      border-radius: 4px;
      background: var(--brand-soft);
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .progress-text { color: var(--text-2); font-size: 14px; }
    .progress-bar { flex: 1 1 260px; height: 8px; overflow: hidden; border-radius: 999px; background: #dbeafe; }
    .progress-fill { height: 100%; width: 0%; background: var(--brand); transition: width 160ms ease; }
    .grid { display: grid; gap: 16px; }
    .section-card {
      border: 1px solid #dbeafe;
      border-radius: 4px;
      background: #f8fbff;
      padding: 16px;
      margin-top: 12px;
    }
    .section-card:first-child { margin-top: 0; }
    .section-card p { margin: 0; color: var(--text-2); font-size: 13px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .card-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .id-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .id { color: var(--brand); font-weight: 700; font-size: 13px; }
    .title { margin: 4px 0 0; font-weight: 700; font-size: 18px; }
    .scope { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .owner-tag {
      display: inline-flex;
      align-items: center;
      height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      background: #f5f5f5;
      color: var(--muted);
    }
    .owner-global { background: #ecfdf5; color: #047857; }
    .owner-client { background: #fff7ed; color: #c2410c; }
    .owner-landing { background: #fdf2f8; color: #be185d; }
    .owner-front { background: #fefce8; color: #a16207; }
    .cols { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 12px; margin: 12px 0; }
    .info {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fcfcfd;
      padding: 12px;
      color: var(--text-2);
      font-size: 13px;
    }
    .info strong { display: block; color: var(--text); margin-bottom: 6px; font-size: 12px; }
    .options { display: grid; gap: 8px; margin-top: 12px; }
    .option {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      cursor: pointer;
    }
    .option:hover { border-color: var(--brand); background: #f8fbff; }
    .option input { margin-top: 3px; }
    .option-title { font-weight: 600; color: var(--text); }
    .option-desc { margin-top: 2px; color: var(--text-2); font-size: 13px; }
    .recommended { color: var(--success); font-size: 12px; font-weight: 600; }
    .advice-box {
      margin-top: 12px;
      border: 1px dashed #cbd5e1;
      border-radius: 4px;
      background: #f8fafc;
      padding: 12px;
      color: var(--text-2);
      font-size: 13px;
    }
    .advice-box strong { display: block; color: var(--text); margin-bottom: 6px; }
    .note { margin-top: 12px; }
    .summary {
      margin-top: 24px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      padding: 18px;
    }
    .summary textarea { min-height: 340px; font-family: Menlo, Consolas, monospace; font-size: 12px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    @media (max-width: 840px) {
      .hero { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      .meta, .cols { grid-template-columns: 1fr; }
      .scope { white-space: normal; }
    }
    @media print {
      body { background: #fff; }
      .toolbar, .progress-card, .summary, .note { display: none; }
      .page { padding: 16px; max-width: none; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>

      </div>
      <div class="toolbar">
        <button type="button" id="fillRecommended">填入推荐项</button>
        <button type="button" id="clearAll">清空选择</button>
      </div>
    </section>

    <section class="meta" aria-label="确认信息">
      <div class="field">
        <label class="field-label" for="owner">确认人</label>
        <input id="owner" type="text" value="miekoyychen / addietang / brennali / jingsujiang" />
      </div>
      <div class="field">

      </div>
      <div class="field">

        <input id="scope" type="text" value="周一 ClawPro portable design pack 交付" />

    </section>

    <section class="progress-card">
      <div class="progress-text"><strong id="progressCount">已确认 0 / 0</strong>，未确认项会在摘要里标为“待继续确认”。无选项项只输出问题说明与决策建议。</div>
      <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
    </section>

    <section class="grid" id="cards"></section>

    <section class="summary">
      <h2>确认摘要</h2>
      <textarea id="summary" readonly></textarea>
      <p class="hint">说明：本页只保存在当前浏览器 localStorage，不会上传数据。需要对外同步时，手动复制上方摘要即可。</p>
    </section>
  </main>

      'L-01': 'A',

      'L-04': 'C',
      'L-05': 'C',
      'D-01': 'B',
      'D-02': 'B',
      'D-03': 'B',
    };

    const defaultNotes = {
      'C-016': '暂选，不是很确定，后期进一步确认。',
      'C-019': '暂定，后续进一步确认。',
      'D-03': '同事确认当前没有引用 Tenant Text Switch；该弱切换样式从周一交付包删除。',
    };

    const stateKey = 'clawpro-design-arbitration-v5';
    const cards = document.getElementById('cards');
    const summary = document.getElementById('summary');
    const progressCount = document.getElementById('progressCount');
    const progressFill = document.getElementById('progressFill');
    const owner = document.getElementById('owner');
    const date = document.getElementById('date');
    const scope = document.getElementById('scope');

    function loadState() {
      try { return JSON.parse(localStorage.getItem(stateKey) || '{}'); }
      catch { return {}; }
    }

    function isSelectable(item) {
      return Boolean(item.options);
    }

    function saveState() {
      const data = { owner: owner.value, date: date.value, scope: scope.value, answers: {}, notes: {} };
      for (const item of items) {
        if (isSelectable(item)) {
          const checked = document.querySelector(`input[name="${item.id}"]:checked`);
          data.answers[item.id] = checked ? checked.value : '';
        }
        data.notes[item.id] = document.getElementById(`${item.id}-note`).value;
      }
      localStorage.setItem(stateKey, JSON.stringify(data));
      renderSummary();
    }

    function restoreState() {
      const data = loadState();
      owner.value = data.owner || owner.value;
      for (const reviewer of ['addietang', 'brennali']) {
        if (!owner.value.includes(reviewer)) owner.value = `${owner.value} / ${reviewer}`;
      }
      date.value = data.date || date.value;
      scope.value = data.scope || scope.value;
      for (const item of items) {
        const answer = data.answers?.[item.id] || defaultAnswers[item.id];
        if (isSelectable(item) && answer) {
          const input = document.querySelector(`input[name="${item.id}"][value="${answer}"]`);
          if (input) input.checked = true;
        }
        const note = document.getElementById(`${item.id}-note`);
        const noteValue = data.notes?.[item.id] || defaultNotes[item.id];
        if (note && noteValue) note.value = noteValue;
      }
      renderSummary();
    }

    function renderCards() {
      cards.innerHTML = '';
      let currentSection = '';
      for (const item of items) {
        if (item.section !== currentSection) {
          currentSection = item.section;
          const section = document.createElement('section');
          section.className = 'section-card';
          section.innerHTML = `<h2>${sections[currentSection]}</h2><p>${sectionDescriptions[currentSection]}</p>`;
          cards.appendChild(section);
        }

        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-head">
            <div>
              <div class="id-row">
                <span class="id">${item.id}</span>
                <span class="owner-tag ${item.ownerClass || ''}">${item.owner || '待确认'}</span>
              </div>
              <div class="title">${item.title}</div>
            </div>
            <div class="scope">${item.scope}</div>
          </div>
          <div class="cols">
            <div class="info"><strong>待确认问题</strong><span></span></div>
            <div class="info"><strong>当前交付包 / 现状</strong><span></span></div>
          </div>
          <div class="dynamic"></div>
          <div class="note">
            <label class="field-label" for="${item.id}-note">补充说明 / 例外条件</label>
            <textarea id="${item.id}-note" placeholder="可选：写给负责人、客户端/落地页同事，或后续改文档的说明"></textarea>
          </div>
        `;
        const spans = card.querySelectorAll('.info span');
        spans[0].textContent = item.leaderQuestion;
        spans[1].textContent = item.currentStandard;
        const dynamic = card.querySelector('.dynamic');

        if (isSelectable(item)) {
          const optionWrap = document.createElement('div');
          optionWrap.className = 'options';
          for (const [key, value] of Object.entries(item.options)) {
            const label = document.createElement('label');
            label.className = 'option';
            label.innerHTML = `
              <input type="radio" name="${item.id}" value="${key}" />
              <div>
                <div class="option-title">${key}. ${key === item.recommended ? '<span class="recommended">推荐</span>' : ''}</div>
                <div class="option-desc"></div>
              </div>
            `;
            label.querySelector('.option-desc').textContent = value;
            optionWrap.appendChild(label);
          }
          dynamic.appendChild(optionWrap);
        } else {
          const advice = document.createElement('div');
          advice.className = 'advice-box';
          advice.innerHTML = '<strong>决策建议</strong><span></span>';
          advice.querySelector('span').textContent = item.advice;
          dynamic.appendChild(advice);
        }

        cards.appendChild(card);
      }
    }

    function renderSummary() {
      const lines = [];
      let done = 0;
      const selectable = items.filter(isSelectable);
      lines.push('ClawPro 新皮肤 Skill 设计确认答复');
      lines.push('');
      lines.push(`确认人：${owner.value || '未填写'}`);
      lines.push(`确认日期：${date.value || '未填写'}`);
      lines.push(`适用范围：${scope.value || '未填写'}`);
      lines.push('');
      let currentSection = '';
      for (const item of items) {
        if (item.section !== currentSection) {
          currentSection = item.section;
          lines.push('');
          lines.push(`## ${sections[currentSection]}`);
        }
        const note = document.getElementById(`${item.id}-note`)?.value.trim();
        if (isSelectable(item)) {
          const checked = document.querySelector(`input[name="${item.id}"]:checked`);
          if (checked) done += 1;
          const answer = checked ? checked.value : '待继续确认';
          const text = checked ? item.options[checked.value] : '尚未选择。';
          lines.push(`${item.id} ${item.title}（${item.owner}）：${answer}`);
          lines.push(`- ${text}`);
        } else {
          lines.push(`${item.id} ${item.title}（${item.owner}）：不在本页直接选择`);
          lines.push(`- 建议：${item.advice}`);
        }
        if (note) lines.push(`- 补充：${note}`);
      }
      lines.push('');
      lines.push('说明：已确认项可写入新版 Skill / portable design pack；标记为客户端或落地页设计师确认的项，应转给对应同事确认；未确认项继续进入 conflict-log，不由 AI 自行裁决。');
      summary.value = lines.join('\n');
      progressCount.textContent = `已确认 ${done} / ${selectable.length}`;
      progressFill.style.width = `${selectable.length ? Math.round((done / selectable.length) * 100) : 0}%`;
    }

    document.addEventListener('change', saveState);
    document.addEventListener('input', saveState);

    document.getElementById('fillRecommended').addEventListener('click', () => {
      for (const item of items) {
        if (!isSelectable(item) || !item.recommended) continue;
        const input = document.querySelector(`input[name="${item.id}"][value="${item.recommended}"]`);
        if (input) input.checked = true;
      }
      saveState();
    });

    document.getElementById('clearAll').addEventListener('click', () => {
      for (const input of document.querySelectorAll('input[type="radio"]')) input.checked = false;
      for (const note of document.querySelectorAll('textarea[id$="-note"]')) note.value = '';
      saveState();
    });

    renderCards();
    restoreState();
  </script>
